<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 359" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="sim-ambient" cx="50%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#0f1b2d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#070a12" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arm-lower-grad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="arm-upper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="sim-glow-blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sim-glow-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sim-glow-amber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Simulation Background -->
  <rect width="1024" height="359" fill="#04060a"/>
  <rect width="1024" height="359" fill="url(#sim-ambient)"/>

  <!-- Perspective Floor Grid (Dashed Cyan Lines) -->
  <g stroke="#143e66" stroke-width="1.3" stroke-dasharray="4 6" opacity="0.9">
    <!-- Horizontal Perspective Lines -->
    <line x1="60" y1="180" x2="964" y2="180" />
    <line x1="30" y1="205" x2="994" y2="205" />
    <line x1="0" y1="236" x2="1024" y2="236" />
    <line x1="0" y1="274" x2="1024" y2="274" stroke-width="1.4"/>
    <line x1="0" y1="322" x2="1024" y2="322" stroke-width="1.5"/>

    <!-- Perspective Depth Rays Radiating to Center Horizon (512, 130) -->
    <line x1="512" y1="130" x2="-20" y2="359" />
    <line x1="512" y1="130" x2="120" y2="359" />
    <line x1="512" y1="130" x2="260" y2="359" />
    <line x1="512" y1="130" x2="390" y2="359" />
    <line x1="512" y1="130" x2="512" y2="359" stroke-dasharray="3 7"/>
    <line x1="512" y1="130" x2="634" y2="359" />
    <line x1="512" y1="130" x2="764" y2="359" />
    <line x1="512" y1="130" x2="904" y2="359" />
    <line x1="512" y1="130" x2="1044" y2="359" />

    <!-- Isometric Cross-hatch Grid Guides -->
    <line x1="40" y1="320" x2="380" y2="180" opacity="0.6"/>
    <line x1="984" y1="320" x2="644" y2="180" opacity="0.6"/>
    <line x1="180" y1="359" x2="520" y2="180" opacity="0.4"/>
    <line x1="844" y1="359" x2="504" y2="180" opacity="0.4"/>
  </g>

  <!-- Work Platform (Perspective Trapezoid Plate) -->
  <polygon points="362,226 665,226 706,273 324,273" fill="#121620" stroke="#3e4758" stroke-width="1.8"/>

  <!-- Target Object (Solid Cyan Box on Right Platform) -->
  <g>
    <!-- Box top highlight -->
    <polygon points="585,215 621,215 621,218 585,218" fill="#38bdf8"/>
    <!-- Box body -->
    <rect x="585" y="217" width="36" height="24" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <!-- Trajectory Arc (Dashed Glowing Curved Path) -->
  <path d="M 420,212 Q 498,132 577,188" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-dasharray="5 5" filter="url(#sim-glow-blue)"/>

  <!-- Robot Arm Link 1 (Lower Arm: Base to Elbow) -->
  <line x1="420" y1="212" x2="452" y2="118" stroke="#334155" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="420" y1="212" x2="452" y2="118" stroke="url(#arm-lower-grad)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="420" y1="212" x2="452" y2="118" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Robot Arm Link 2 (Upper Arm: Elbow to Wrist) -->
  <line x1="452" y1="118" x2="577" y2="188" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <line x1="452" y1="118" x2="577" y2="188" stroke="url(#arm-upper-grad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="452" y1="118" x2="577" y2="188" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Robot Base Pedestal (Dark rounded chassis) -->
  <rect x="395" y="219" width="50" height="20" rx="4" fill="#222630" stroke="#475569" stroke-width="1.6"/>
  <line x1="402" y1="229" x2="438" y2="229" stroke="#334155" stroke-width="1.2"/>

  <!-- Base Pivot Joint (Blue Joint) -->
  <circle cx="420" cy="212" r="11" fill="#1d4ed8" filter="url(#sim-glow-blue)" opacity="0.8"/>
  <circle cx="420" cy="212" r="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="420" cy="212" r="3.2" fill="#1e3a8a"/>

  <!-- Elbow Pivot Joint (Green Joint) -->
  <circle cx="452" cy="118" r="11" fill="#059669" filter="url(#sim-glow-green)" opacity="0.85"/>
  <circle cx="452" cy="118" r="8" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
  <circle cx="452" cy="118" r="3" fill="#ffffff"/>

  <!-- Wrist Pivot Joint (Amber Joint) -->
  <circle cx="577" cy="188" r="8" fill="#d97706" filter="url(#sim-glow-amber)" opacity="0.85"/>
  <circle cx="577" cy="188" r="5.5" fill="#f59e0b" stroke="#fef08a" stroke-width="1.6"/>
  <circle cx="577" cy="188" r="2.2" fill="#78350f"/>

  <!-- End-Effector Gripper (Dual Prong Robotic Fingers) -->
  <path d="M 577,188 L 595,199 L 607,196 M 595,199 L 599,213" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
